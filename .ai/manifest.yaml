version: 1

targets:
  claude:
    enabled: true

  codex:
    enabled: true
    # Codex has no repository permission rules or sandbox settings. The deny
    # rules and the sandbox below hold in Claude Code only; these are known
    # gaps, accepted so CI can stay --strict.
    accept: [permissions-unsupported, sandbox-unsupported]

agents:
  - principal-architect
  - staff-engineer
  - security

rules:
  - engineering
  - testing
  - docs

commands: []

# The hardened preset denies the agent's file tools any read of .env, .env.*,
# *.pem, and *.key, and runs shell commands inside Claude Code's OS sandbox,
# where the same rules and the sandbox's protected paths (.claude settings and
# hooks) bind cat, sed -i, cp, and the processes they start.
security: hardened

# Claude Code asks before a sandboxed command reaches any host not listed here.
# Only GitHub's API is pre-allowed, for gh. Git itself uses SSH through the
# 1Password agent, which the sandbox cannot reach, so every fetch and push
# needs an approved unsandboxed retry and a 1Password confirmation. That is
# deliberate. The trade: a sandboxed command can still reach GitHub's API with
# any token it holds. See docs/threat-model.md.
sandbox:
  network:
    allowedDomains:
      - api.github.com
