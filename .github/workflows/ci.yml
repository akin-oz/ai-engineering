name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
      - run: npx --no-install ai validate
      - run: npx --no-install ai sync
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain)"

  package-smoke:
    name: Packed package smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install packed package
        run: |
          mkdir "$RUNNER_TEMP/package-smoke"
          cd "$RUNNER_TEMP/package-smoke"
          npm init --yes
          npm install "$RUNNER_TEMP"/*.tgz
      - name: Verify packed CLI
        run: |
          cd "$RUNNER_TEMP/package-smoke"
          npx ai --version
          npx ai --help
      - name: Verify packed API
        run: |
          cd "$RUNNER_TEMP/package-smoke"
          node --input-type=module -e 'const api = await import("@akinlabs/ai-engineering"); for (const name of ["compile", "validate", "loadManifest", "createAdapterRegistry", "validateAdapterRegistry"]) if (typeof api[name] !== "function") process.exit(1);'
